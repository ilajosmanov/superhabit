name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.4.0'
          node-version: '22.23.4'
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # First: it generates server/worker-configuration.d.ts, which the type-aware lint reads.
      - run: vp run typecheck
      - run: vp check
      - run: vp run lint:kt
      # A dev bundle runs the React Compiler on every screen and fails on one it can't compile; lint doesn't.
      - run: vp exec expo export --dev --platform android --output-dir "$RUNNER_TEMP/bundle"
      - run: vp test run
